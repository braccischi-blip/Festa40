<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>40 anni di Alessio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#08080c;
    --bg-panel:#111116;
    --border:#232329;
    --violet:#7c5cff;
    --cyan:#4dd8e6;
    --text:#f2f2f5;
    --text-muted:#8a8a97;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:24px;
    background:var(--bg-deep);
    font-family:'Space Grotesk', sans-serif;
    color:var(--text);
    position:relative;
    overflow:hidden;
  }

  /* glow ambientali morbidi, per un effetto "tech" contemporaneo */
  .glow{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0;opacity:.35;}
  .glow.a{width:420px;height:420px;background:var(--violet);top:-140px;left:-120px;}
  .glow.b{width:380px;height:380px;background:var(--cyan);bottom:-160px;right:-100px;}

  .panel{
    position:relative;z-index:1;
    width:100%;max-width:440px;
    background:rgba(17,17,22,.85);
    border:1px solid var(--border);
    border-radius:20px;
    padding:44px 36px 36px;
    text-align:center;
    backdrop-filter:blur(20px);
    box-shadow:0 30px 80px rgba(0,0,0,.5);
  }

  .badge{
    display:inline-flex;align-items:center;gap:7px;
    font-family:'IBM Plex Mono', monospace;font-size:12px;
    color:var(--cyan);
    background:rgba(77,216,230,.08);
    border:1px solid rgba(77,216,230,.25);
    border-radius:100px;
    padding:6px 14px;
    margin-bottom:22px;
    letter-spacing:.02em;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);}

  h1{
    font-size:clamp(26px, 6vw, 32px);
    font-weight:700;
    margin:0 0 12px;
    line-height:1.25;
    letter-spacing:-.01em;
  }
  h1 span{
    background:linear-gradient(90deg, var(--violet), var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  p.intro{
    font-size:16px;color:var(--text-muted);
    margin:0 0 32px;line-height:1.6;
  }

  .choices{display:flex;flex-direction:column;gap:12px;}
  .choice{
    display:flex;align-items:center;gap:14px;
    text-align:left;
    text-decoration:none;
    color:var(--text);
    background:rgba(255,255,255,.02);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px 18px;
    transition:border-color .2s ease, background .2s ease, transform .15s ease;
  }
  .choice:hover{
    border-color:var(--violet);
    background:rgba(124,92,255,.07);
    transform:translateY(-2px);
  }
  .choice-icon{
    flex:0 0 auto;
    width:38px;height:38px;
    border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    background:rgba(124,92,255,.12);
    color:var(--violet);
  }
  .choice.cyan .choice-icon{background:rgba(77,216,230,.12);color:var(--cyan);}
  .choice-text{flex:1;}
  .choice-title{font-size:15px;font-weight:600;margin:0 0 2px;}
  .choice-sub{font-size:13px;color:var(--text-muted);margin:0;}
  .choice-arrow{flex:0 0 auto;color:var(--text-muted);font-size:18px;transition:transform .2s ease, color .2s ease;}
  .choice:hover .choice-arrow{transform:translateX(3px);color:var(--text);}

  @media (max-width:400px){
    .panel{padding:34px 22px 28px;border-radius:16px;}
  }
</style>
</head>
<body>

  <div class="glow a"></div>
  <div class="glow b"></div>

  <div class="panel">
    <span class="badge"><span class="dot"></span>INVITO DIGITALE</span>
    <h1>40 anni di <span>Alessio</span></h1>
    <p class="intro">Sei stato invitato. Scegli come vuoi aprire l'invito.</p>

    <div class="choices">
      <a class="choice" href="festa-anni90.html">
        <span class="choice-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"></rect><line x1="7" y1="10" x2="7" y2="14"></line><line x1="5" y1="12" x2="9" y2="12"></line><circle cx="16" cy="10" r="1"></circle><circle cx="18.5" cy="12.5" r="1"></circle></svg>
        </span>
        <span class="choice-text">
          <p class="choice-title">Versione interattiva</p>
          <p class="choice-sub">L'esperienza completa, passo per passo</p>
        </span>
        <span class="choice-arrow">→</span>
      </a>

      <a class="choice cyan" href="invito-elegante.html">
        <span class="choice-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 L14.5 8.5 L21 9.5 L16.5 14 L17.8 20.5 L12 17.3 L6.2 20.5 L7.5 14 L3 9.5 L9.5 8.5 Z"></path></svg>
        </span>
        <span class="choice-text">
          <p class="choice-title">Versione essenziale</p>
          <p class="choice-sub">Il biglietto, in breve</p>
        </span>
        <span class="choice-arrow">→</span>
      </a>
    </div>
  </div>

</body>
</html>
